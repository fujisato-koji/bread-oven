  - {id: b-assy, phase: dome, kind: work, days: 1, after: [w-cure], temp: 5, name: ドームをばらして継ぎ目を詰め、組み直す, parts: [chamber, seam, band, hearth], reqs: [R-13, R-02c, R-07], src: [],
     desc: 蓋を外して砂を上から掻き出し、入口の枠、前の輪、後ろの輪の順に外す（乾いた 1 個は 22 kg 以下。初めて持つ輪は水を含んで 22 kg を超えうるので、乾かす日を延ばすか 2 人で持つ。ひとりで持つのは、試し塗りのかけらで練り水の 94% 以上が抜けたと確かめてから。届くかは未確認なので 2 人で持つ方を勧める。前の輪は前の帯の中ほどを左右から下に手を入れて持つ）。外した個を 1 個ずつ量って記録する。継ぎ目の面の紙を落とす。ドームの足が載るレンガの上に縄を敷き（足の幅の中ほど、焚き口の両脇で止める。入口の枠の脚の下にも敷く。毛布の帯でもよい）、生体溶解性の紙 1 mm を切って継ぎ目に挟み、縦の継ぎ目の段の外の半分には編んだ平たいガラス繊維のテープを挟みながら、後ろの輪、前の輪、入口の枠、蓋の順に戻す。冷えた窯で帯をぴったり当て、ステンレスの M8 に焼き付き止めを塗って手で締める（締めすぎない。熱いときに締め直さない）。継ぎ目の外に耐火モルタルを幅 50 mm、厚さ 4 mm で薄く塗る。日数は推定。}
  - {id: b-land, phase: dome, kind: work, days: 1, after: [b-assy, b-door], name: 前室を据え、扉とダンパーを付ける, parts: [landing, door, damper], reqs: [R-02c, R-12, R-15, R-08], src: [],
     desc: 入口の枠の鍔の前の面に毛布の帯を置く（袖の線は x = ±0.168〜0.180 m、天板の線は炉床から 0.240〜0.252 m。差し込みの扉の面の板にかけない）。前の縁の帯の上に脇の水切り板（ステンレス 0.5 mm を L 形に折り、後ろの端を立ち上げる）を載せ、前室の箱の袖を水切り板の上に立てる（天板に直に触れさせない）。箱を鍔へ押して受け金の位置を決め、受け金を天板にステンレスの M8 で留め、引きボルト（M8 × 110）と押しばねを掛ける。箱の耳の長穴を引きボルトに上から掛け、箱を手で鍔へ押してからナットを締め、押しばねを 30 mm に縮める（片側 40 N、仮）。入口の枠に金物を埋めない（付録 B.14）。天井の内に薄いレンガ 3 枚を張る（1 枚を 110 mm に 2 つに切り、煙突の口の所を φ0.12 m に切り欠く。湿式か集じんで切る）。焚き口の差し込みの扉が前室を通って焚き口に入り、面の板が入口の枠に当たって閉まるかを確かめる。前室の口の引き戸をレールに入れ、止めのピンの穴（閉、1/4、1/2、全開）を確かめる。ダンパーの差し板を天板の上の溝に入れる。前掛けが天板の前の縁に掛かるかを確かめる。日数は推定。}
  - {id: b-door, phase: dome, kind: work, days: 2, after: [b-buy2, b-steelcut, b-castorder], side: true, name: 扉とダンパーを作る, parts: [door, damper], reqs: [R-02b, R-02c], src: [],
