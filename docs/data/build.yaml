  # 毛布と殻
  - {id: b-blanket, phase: skin, kind: work, days: 1, after: [b-land, b-castorder], name: 毛布を 3 層巻き、ガラスクロスで包む, parts: [insulation], reqs: [R-02b, R-12], src: [M25, M132],
     desc: 防じんマスクを着け、毛布 25 mm を 3 層、継ぎ目をずらして巻き、1 層目は継ぎ目にまたがせる。ステンレスの針金で留める。炉床の四角の 4 隅（毛布の円の外に出る所）と、縁の帯の無い側面を毛布の切れ端で覆う。入口の枠の鍔の裏と毛布の外の面のあいだ（上の角で最大 72 mm）にも切れ端を詰める（構造設計 3.9.4）。外をガラスクロスで包み（重ねしろ 50 mm）、同じ針金で留める。アルミ箔を貼った布は湯気がこもるので使わない。日数は推定。}
  - {id: b-shell, phase: skin, kind: work, days: 1, after: [b-blanket, b-mail3, b-mail, w-top2], name: 殻を据える, parts: [shell, vent], reqs: [R-08, R-12], src: [],
     desc: 殻の枠（L25、45°の切妻、軒 1.12 m、棟 1.55 m）を天板に M8 で留め、塗った鋼板の小板と波板をドリルねじで張る。板は枠に 150 mm 以下の間でねじを打ち、せん断の面として効かせる。棟包みは 2 本を重ねて継ぐ。後ろの妻の頂にベントを付けて口の内に網を張り（ネズミと虫よけ）、裾の 10 mm のすきまにも同じ網を張る。前室との取り合いにステンレスの当て板を入れ、冷たい外の縁だけを耐熱シリコンで留める。日数は推定。}
  - {id: b-chim, phase: dome, kind: work, days: 1, after: [b-shell, b-buy2], name: 煙突を立てる, parts: [chimney], reqs: [R-11, R-12], src: [P92],
