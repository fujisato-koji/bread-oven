# 製作の工程と日数。タイムラインモード（docs/navigator/tl.js）が日程に組む。
# kind: work は人の手が要る作業で、作業する日で数える。1 人で行うので、同じ日に 2 つの作業は入れない。
#       wait は養生や乾燥の待ちで、暦日で数える。その間にほかの作業を入れられる。
#       mile は節目（日数なし）。
# after: 前の工程。すべて終わってから始める。
# side: 合間の作業。主の流れの工程に日を割り当てたあとで、空いた日に入れる。
# cont: 続けて行う作業。作業できる日に始め、暦日で続ける（土日だけの日程では平日も使う）。
# temp: その気温（℃）以上の日に行う。左官は 5（P86）、耐火モルタルは練った温度 10（P94）。
# parts は docs/data/model.yaml の部品の id、reqs は要求の番号、src は sources.md の記号。
# 日数の根拠は、付録 B（docs/07-build.md）の表に書く。出典の無い作業の日数は推定で、desc に「推定」と書く。
meta:
  title: 製作の日程
  rev: "0.2"
  start: "2027-05-15"
  start_note: 始める日は仮。キャスタブルを流す日を、夜も 5℃ を下回らない時期（6 月以降の見込み、未確認）に入れるため、前の 5 月 1 日から 2 週ずらした。待ちの日数は気温 15℃ 以上の値で、寒い時期は延びる（付録 B）。
  temp_note: キャスタブルは練った温度を 10〜30℃ にし、凍るおそれのある日は流さない（P94）。硬化するまでの 24 時間以上の養生のあいだは凍らせない（P106）。硬化したあとと乾燥焚きのあとは、凍っても対策は要らない（P106）。流す日と養生のあいだの気温 5℃ 以上は目安で、推定である。パーライトとセメントは気温 5℃ 以上で打つ（P86）。さび止めと上塗りは気温 5℃ 以上、湿度 85% 以下で塗る。
  note: 製作の工程を、前後の関係と養生や乾燥の待ちから日程に組んだもの。作業の日数の多くは推定（付録 B）。
  first_bake: m-firstbake

phases:
  - {id: prep, name: 準備と調達}
  - {id: base, name: 据え台と台}
  - {id: slab, name: 炉床の断熱と炉床}
  - {id: dome, name: ドームと前室}
  - {id: skin, name: 毛布と殻}
  - {id: fire, name: 乾燥焚きと仕上げ}

tasks:
  # 準備と調達
  - {id: b-site, phase: prep, kind: work, days: 1, after: [], name: 据える場所を決め、消防と基準風速を確かめる, parts: [], reqs: [R-11, R-08], src: [P23, P109],
     desc: 据える場所と、煙突や薪置きのまわりの離隔を決める。火災予防条例の扱いを消防に確かめる（要求 1.4 の 8）。据える町の基準風速と地表面の粗度を確かめる。風の留めは据える町によらず鎖の向きに 4.9 kN で作り、確かめた値が低ければ平板と金物を減らせる（施主の決定、構造設計 3.5）。冬の靴で立った肘の高さを測り、そこから 0.10 m 下を炉床の高さにする（0.85〜1.0 m、ふつう 0.90 m）。脚の長さはこの高さで決める。風の留めを埋める所（各脚から外へ約 0.9 m まで、深さ 0.7 m）に、水道管や電線が通っていないかを確かめる。日数は推定。}
  - {id: b-buy1, phase: prep, kind: work, days: 1, after: [b-site], name: 据え台と台と断熱の材料を買う, parts: [foundation, stand, slab, hearthIns, chamber], reqs: [], src: [],
     desc: 砕石、ピンコロ（灰入れの台の 1 個を含む）、コンクリート平板 6 枚、風の留めの全ねじ M16 とナットと角座金、アイナットとシャックルとターンバックルと鎖、セメント、パーライト、合板、不織布、型の剥がし紙、砂、覆い、耐熱塗料、足の敷き板の鋼板 3.2 × 300 × 300 を店で買う。角パイプ（50 角はめっきの無い鋼、40 角はめっきでもよい）、山形鋼（L50、L25）、平鋼、鋼管、天板の切り板は鋼材店で重さで買い、長さに切ってもらう（調達モード）。日数は推定。}
  - {id: b-order, phase: prep, kind: wait, days: 14, after: [b-site], name: 耐火レンガと縞鋼板の取り寄せ, parts: [hearth, landing, door], reqs: [], src: [M90, M95, M77],
     desc: コメリで取り寄せる。前掛けの縞鋼板 450 × 600 も頼む。宅配は北海道へ 7 日以上（M90、抜粋）。縞鋼板はネットで注文して店で受け取る（M95）。道内の店で受け取れるかは未確認。14 日は推定。}
  - {id: b-mail2, phase: prep, kind: wait, days: 16, after: [b-site], name: ねじ、塗料、ステンレスの板と網、ガラスクロスを通販で取り寄せる, parts: [stand, slab, shell, insulation], reqs: [], src: [M124, M129, M130, M132, M121, M122, M119, M120],
     desc: エスコの品番のねじと、足の M24 のナットと座金と、毛布を包むガラスクロスと、帯と前室に使うステンレスの M8 と前室の押しばねをモノタロウで、さび止め、上塗り、ステンレスの板 2 枚（当て板と前室の脇の水切り板）と網を DCM オンラインで頼む。上塗りは 6〜10 営業日で発送する（M122）ので、北海道へ届くまでを 16 日と置いた（推定）。}
  - {id: b-mail3, phase: prep, kind: wait, days: 7, after: [b-site], name: 殻の板と波板と耐熱シリコンと足の全ねじを通販で取り寄せる, parts: [shell, stand], reqs: [R-08], src: [M117, M118, M123, M128],
     desc: 塗った鋼板の小板（K371）と耐熱シリコンをモノタロウで、塗った小波の波板と足の全ねじ M24 を DIY FACTORY で頼む。どちらも北海道へ届く表示がある。7 日は推定。}
  - {id: b-mail, phase: prep, kind: wait, days: 7, after: [b-site], name: 通販で取り寄せる（コーナン）, parts: [vent], reqs: [], src: [M88],
     desc: 放射温度計と頂部のベントをコーナンの通販で頼む。出荷から北海道へ 3 日以上かかる（M88）。7 日は推定。}
  - {id: b-buy2, phase: prep, kind: work, days: 1, after: [b-site], side: true, name: 煙突、扉の材料、灰入れを買う, parts: [chimney, door, damper], reqs: [], src: [],
     desc: 煙突、H 笠、支持金具、煙突の付け根の筒、ケイカル板、取っ手、丸棒、灰入れを店で買う（調達モード）。日数は推定。}
  - {id: b-castorder, phase: prep, kind: wait, days: 7, after: [b-pad], name: キャスタブル、毛布、継ぎ目の材料を取り寄せる, parts: [chamber, insulation, seam, landing], reqs: [R-05], src: [M114, M116, M125],
     desc: キャスタブル 3 袋、毛布の巻き、継ぎ目の紙と縄と耐火モルタル、薄いレンガを通販で頼む。キャスタブルは製造から 6〜12 か月で使うので、据え台ができてから頼む（P71、P106）。届いたら袋のロット番号で製造日を確かめ、床から浮かせて乾いた所に置く。7 日は推定。}

  # 据え台と台
  - {id: b-dig, phase: base, kind: work, days: 3, after: [b-buy1], name: 風の留めの平板を埋め、据え台の穴に砕石を締める, parts: [foundation, anchor], reqs: [R-08, R-14], src: [P98],
     desc: 各脚から外へ 0.66 m の所（後ろの脚は左右の外と少し後ろ、前の脚は前）に、50 × 90 cm、深さ約 70 cm の穴を掘り、底を外へ上る 30°の斜めにする。受け材（山形鋼 L50 を 0.55 m、真ん中に 18 mm の穴）に M16 の全ねじを通して角座金とナット 2 個で留め、その上にコンクリート平板 2 枚をすきま 15〜20 mm で並べ、全ねじをすきまから脚の耳の向きに水平から 60°で出す。土を 15 cm ごとに突き固めて埋め戻し（土かぶり 0.6 m）、全ねじの頭にアイナットを付ける。据える町で要る強さが 3.5 kN を超えるなら、埋め戻したあとに 1 本ずつ引いて確かめる（方法は施主が決める、要求 1.4 の 15）。据え台の 3 か所に 40 cm 角、深さ 20 cm の穴を掘り、底に外への勾配を付け、砕石を 10 cm 入れてタンパーで締める。土が粘土質なら 45 cm 角にし、砕石を 15 cm にする（構造設計 3.5）。日数は推定。}
  - {id: b-pad, phase: base, kind: work, days: 1, after: [b-dig], name: 据え台を据える, parts: [foundation], reqs: [R-08, R-14], src: [],
     desc: ピンコロ 3 個の中心に径 26 mm、深さ 100 mm の穴をあける。ピンコロを砕石の上に据え、上面を地面から 50 mm に、3 個の差を 5 mm 以内にそろえる。固めずに置き、平板は手で掘り出せるので、手で撤去できる。日数は推定。}
  - {id: b-steelcut, phase: base, kind: work, days: 2, after: [b-order, b-mail2, b-mail3, b-buy1], name: 鋼材を切り、穴をあける, parts: [stand, slab, shell, band, door, damper, landing], reqs: [R-07], src: [],
     desc: 切り出しの一覧のとおり、角パイプ、山形鋼、平鋼、天板、縞鋼板、全ねじを切り、穴をあける。脚の長さは b-site で決めた炉床の高さに合わせる（炉床 0.90 m で 0.44 m）。足の全ねじ M24 は 0.28 m に、さや管 SGP 25A は 0.1 m に切る。底板の真ん中にホールソー 35 mm でさや管の穴をあける。敷き板（鋼板 3.2 × 300 × 300 から 98 mm 角を 18 枚）に径 26 mm の穴と、縁から穴までの幅 26 mm の切り欠きを入れる。台の交点の当て板（L50）、管の端を塞ぐ板と脚の耳（平鋼 6 × 100、耳は 60 mm に切って穴 18 mm）、前掛けと前室の口の引き戸（縞鋼板 450 × 600 から）も切る。前室の袖は奥行 0.243 m、高さが口で 0.232 m、奥で 0.244 m の台形に切り、天板は 0.35 × 0.29 m に切って折らない。ダンパーの溝の L25 は立ちの辺を後ろの端 14 mm から前へ 25 mm まで斜めに切る。前室の耳（平鋼 6 × 100 を 60 mm、下から長穴 12 × 36 mm）を 2 枚、受け金（立ち 0.19 m に穴 9 mm、足 70 mm に前後の向きの長穴 10 × 25 mm を 2 つ）を 2 組、天板の水切りの平鋼 3 × 25（0.346 m）を 1 本切る。切り口のばりを取る。日数は推定。}
  - {id: b-weld, phase: base, kind: work, days: 2, after: [b-steelcut], name: 溶接する, parts: [stand, band, landing, door, damper, shell], reqs: [R-07], src: [],
     desc: 施主が 100 V のノンガス半自動の溶接機で溶接する。前の T、後ろの門形、脚の底板とさや管と鎖を掛ける耳、管の端を塞ぐ板、帯のつめと耳、前室の箱（袖は台形、天板は前へ 1/20 下げる）と耳と天板の水切り（平鋼 3 × 25 を断続で）、前室の受け金の立ちと足、扉のレール、前室の天板の上のダンパーの溝（上の辺を水平にする）、殻の枠（L25、45°の切妻）、前掛けの縁。亜鉛めっきの品（40 角をめっきで買ったとき、全ねじ、ボルト）は溶接しない。溶接する所のまわりから燃える物をどけ、消火器と水を置く。日数は推定。}
  - {id: b-prime, phase: base, kind: work, days: 1, after: [b-weld], temp: 5, name: さび止めを塗る, parts: [stand, slab, shell], reqs: [R-08], src: [M121],
     desc: 溶接のスラグと黒皮を落とし、台、天板の下面と縁、殻の枠にさび止めを塗る。気温 5℃ 以上、湿度 85% 以下で塗る。日数は推定。}
  - {id: w-prime, phase: base, kind: wait, days: 1, after: [b-prime], name: さび止めの乾燥, parts: [stand, slab, shell], reqs: [], src: [],
     desc: 上塗りまでに置く日数は未確認で、1 日は推定。}
  - {id: b-top1, phase: base, kind: work, days: 1, after: [w-prime], temp: 5, name: 上塗りの 1 回目, parts: [stand, shell], reqs: [R-08], src: [M122],
     desc: 油性のトタン用の塗料を塗る。前室の外、足元の帯、前掛けは 600℃ の耐熱塗料にする。日数は推定。}
  - {id: w-top1, phase: base, kind: wait, days: 1, after: [b-top1], name: 塗り重ねの待ち, parts: [stand, shell], reqs: [], src: [M109],
     desc: 同じ系統の油性塗料で、塗り重ねは夏 1 日後、冬 2 日後の例がある（M109）。使う塗料の値は未確認。}
  - {id: b-top2, phase: base, kind: work, days: 1, after: [w-top1], temp: 5, name: 上塗りの 2 回目, parts: [stand, shell], reqs: [R-08], src: [M122],
     desc: 2 回目を塗る。日数は推定。}
  - {id: w-top2, phase: base, kind: wait, days: 2, after: [b-top2], name: 上塗りの乾燥, parts: [stand, shell], reqs: [], src: [M109],
     desc: 部材を重ねる前に乾かす。2 日は推定。}
  - {id: b-frame, phase: base, kind: work, days: 1, after: [w-top2, b-pad], name: 台を組んで高さをそろえる, parts: [stand, foundation, anchor], reqs: [R-07, R-08, R-14], src: [],
     desc: 据え台に全ねじと底板の脚を立て、前の T と後ろの門形（脚は左右 ±0.90 m）を載せ、側梁（40 角）と根太を M10 で留める。側梁と横梁の 4 つの交点に山形鋼の当て板を当て、各部材に M10 を 2 本で留めて交点を固める。ナット A と底板のあいだに座金を入れ、ナットで高さを直し（全ねじの出しは 35 mm 以下にし、大きく直すときは敷き板で直す）、天板の面を水平器で 2 mm 以内にそろえる。風の留めのアイナットから脚の耳へ、シャックルと鎖とターンバックルを掛け、手で締めてたるみを取る（張っておく力は入れない）。地面が凍る前の秋に 50 mm の遊びを残し、春に解けてからたるみを取る。ボルトで組むので手で撤去できる。日数は推定。}
  - {id: b-deck, phase: base, kind: work, days: 1, after: [b-frame], name: 天板を留め、不織布を敷く, parts: [slab], reqs: [R-08, R-14], src: [],
     desc: 天板 2 枚（0.95 × 0.48 m と 0.95 × 0.69 m）を z = 0 の根太の上で突き合わせ、根太に M8 で留める。水抜きの穴（前室の下の板の下とその前にも）をあけた天板の全面に水を通す不織布を敷き、殻の外では前室の下の板の形（x = ±0.235 m、z = 0.66 m まで）に切りそろえる（構造設計 3.9.5）。日数は推定。}

  # 炉床の断熱と炉床
  - {id: b-hins, phase: slab, kind: work, days: 1, after: [b-buy1], side: true, temp: 5, name: 炉床の断熱の板と縁の帯を打つ, parts: [hearthIns], reqs: [R-14], src: [P55],
     desc: 平らな所にシートを敷き、合板の帯で型を組む。セメントとパーライト 1:5 で、75 mm の板を 4 区画（0.42 m 角、外の角を 0.12 m 落とす）と前室の下の 1 枚、65 mm の縁の帯を 5 本（左右と後ろは 0.075 × 0.47 m、前は焚き口の両脇から前室の口までの 0.064 × 0.30 m を 2 本）打つ（P55）。前の 2 本の上の面は、殻の外に出る前の約 0.21 m を、内の 10 mm（前室の箱の袖が立つ所）から外の縁へ約 3 mm 下げてならし、脇の水切り板の上の水を外へ流す（構造設計 3.9.5、推定）。型は固まってから外す。日数は推定。}
  - {id: w-hins, phase: slab, kind: wait, days: 7, after: [b-hins], name: 炉床の断熱の乾燥, parts: [hearthIns], reqs: [], src: [F57],
     desc: 数値の基準は無い。経験則は「少し乾いてから」から「数週間」まで（F57）。7 日は経験則の短い側。雨の日は覆う。}
  - {id: b-hcut, phase: slab, kind: work, days: 1, after: [b-order], side: true, name: 前室の口のレンガを切る, parts: [hearth, landing], reqs: [R-01, R-02e], src: [],
     desc: 炉床のレンガは切らない（施主の決定 2026-10-19 の 2 回目の 2）。前室の口に並べるレンガ 1 個を、長さの向きに 3 つ（1 個約 70 mm）に切る（2 回）。湿式か集じんで切り、防じんマスクを着ける。日数は推定。}
  - {id: b-hearth, phase: slab, kind: work, days: 1, after: [w-hins, b-hcut, b-deck], name: 断熱の板と縁の帯を据え、炉床を並べる, parts: [hearthIns, hearth], reqs: [R-01, R-02e, R-04], src: [],
     desc: 不織布の上に断熱の板の 4 区画と前室の下の 1 枚を並べ、継ぎ目に薄いシートを挟む。炉床のレンガ 18 個を、砂を薄く敷いて、列を前後の向きに通した 6 列 × 3 個（0.684 × 0.69 m）に切らずに並べ、隣どうしの段を 1 mm 以下にそろえる。炉床の前に、焚き口の敷居と前室の床として丸ごと 3 個を前後の向きに並べ、前室の口に切った小片 3 個を並べる。炉床の四角の外に縁の帯 5 本を置く。日数は推定。}

  # ドームと前室
  - {id: b-form, phase: dome, kind: work, days: 1, after: [b-hearth], name: 砂の山と型を作る, parts: [chamber, seam], reqs: [R-02d], src: [],
     desc: 炉床をシートで覆い、ドームの足が載る輪（半径 0.30〜0.34 m）のレンガの上に剥がし紙を敷く。湿らせた砂で半径 0.30 m の山を作り、中心のピンで回す合板の型板でならし、紙で覆う。焚き口の型（幅 0.32 m、高さ 0.18 m のアーチ）を置く。後ろと前の輪を分ける仕切り（K371 の切れ端を段の形に曲げ、油を塗る）を z = −0.045 m の面に立てる（段の内の半分は中心から後ろへ 35 mm、外の半分は 55 mm）。厚さの目印の竹串を、頭を 42 mm 出して 50 mm ごとに刺す（約 270 本）。入口の枠の鍔の型（輪の外の形を切り抜いた後ろの板、幅 40 mm の縁の帯、焚き口の形を切り抜いた前の押さえ板）をコンパネで作る。日数は推定。}
  - {id: b-cast1, phase: dome, kind: work, days: 1, after: [b-form, b-castorder], temp: 5, name: 後ろの輪と前の輪を流す, parts: [chamber, band, seam], reqs: [R-02d, R-05, R-04a], src: [P106],
     desc: 後ろの帯と前の帯 2 本を据える。仕切りの後ろに後ろの輪（粉 約 20 kg）を、前に焚き口の型ごと前の輪（約 20.5 kg）を、1 個ずつ粉の 20〜22% の水で練り（粉は厚さの許しの上の端で足りる量）、30 分以内に厚さ 40〜44 mm で押し付ける（P106）。外の半分は緯度 50° まで、内の半分はそこから 20 mm 上まで積んで段にする。余りの粉で練り水の抜けを量るかけら（約 0.4 kg）を作り、板ごと量って記録する（付録 B.11）。濡れた布で覆って湿らせる（P106）。日数は推定。}
  - {id: w-cast1, phase: dome, kind: wait, days: 1, after: [b-cast1], name: 輪の養生, parts: [chamber], reqs: [], src: [P106, P71],
