# 製作の工程と日数。タイムラインモード（docs/navigator/tl.js）が日程に組む。
# kind: work は人の手が要る作業で、作業する日で数える。1 人で行うので、同じ日に 2 つの作業は入れない。
#       wait は養生や乾燥の待ちで、暦日で数える。その間にほかの作業を入れられる。
#       mile は節目（日数なし）。
# after: 前の工程。すべて終わってから始める。
# side: 合間の作業。主の流れの工程に日を割り当てたあとで、空いた日に入れる。
# cont: 続けて行う作業。作業できる日に始め、暦日で続ける（土日だけの日程では平日も使う）。
# temp: その気温（℃）以上の日に行う。左官は 5（P86）、耐火モルタルは練った温度 10（P94）。
# parts は docs/data/model.yaml の部品の id、reqs は要求の番号、src は sources.md の記号。
# 日数の根拠は、付録 B（docs/07-build.md）の表に書く。出典の無い作業の日数は推定で、desc に「推定」と書く。
meta:
  title: 製作の日程
  rev: "0.1"
  start: "2027-05-01"
  start_note: 始める日は仮。据える地点の気候が分かったら決める。待ちの日数は気温 15℃ 以上の値で、寒い時期は延びる（付録 B）。
  temp_note: 左官は気温 5℃ 以下で行わない（P86）。耐火モルタルは練った温度を 10〜30℃ にする（P94）。さび止めは気温 5℃ 以上、湿度 85% 以下で塗る（M103）。
  note: 製作の工程を、前後の関係と養生や乾燥の待ちから日程に組んだもの。作業の日数の多くは推定（付録 B）。
  first_bake: m-firstbake

phases:
  - {id: prep, name: 準備と調達}
  - {id: base, name: 据え台と鉄のテーブル}
  - {id: slab, name: 炉床の断熱と炉床}
  - {id: dome, name: ドームと前室}
  - {id: skin, name: 断熱と外殻}
  - {id: fire, name: 養生焚きと仕上げ}

tasks:
  # 準備と調達
  - {id: b-site, phase: prep, kind: work, days: 1, after: [], name: 据える場所を決め、消防に確かめる, parts: [], reqs: [R-11], src: [],
     desc: 据える場所と、煙突や薪置きのまわりの離隔を決める。火災予防条例の扱いを消防に確かめる（要求 1.4 の 8）。日数は推定。}
  - {id: b-buy1, phase: prep, kind: work, days: 1, after: [b-site], name: 据え台と台と炉床の断熱の材料を買う, parts: [foundation, stand, hearthIns], reqs: [], src: [],
     desc: 砕石、ピンコロ、鋼板 300 角、上塗りの塗料、角パイプのキャップ、セメント、砂、パーライト、合板、不織布を店で買う。角パイプ、平鋼、鋼管は鋼材店で買い、長さに切ってもらう（調達モード）。日数は推定。}
  - {id: b-order, phase: prep, kind: wait, days: 14, after: [b-site], name: 耐火レンガ、耐火モルタル、縞鋼板の取り寄せ, parts: [hearth, chamber, landing, slab], reqs: [], src: [M90, M91, M95],
     desc: コメリで取り寄せる。宅配は北海道へ 7 日以上（M90、抜粋）、耐火モルタルは発送まで 9〜11 日（M91）。縞鋼板はネットで注文して店で受け取る（M95）。14 日は推定。}
  - {id: b-mail2, phase: prep, kind: wait, days: 7, after: [b-site], name: ねじとさび止めを通販で取り寄せる, parts: [stand, slab], reqs: [], src: [M96, M103],
     desc: 溶融亜鉛めっきの全ねじ、ナット、ボルトをエスコの取扱店の通販で、ローバルを直販で頼む。届くまでの日数は未確認で、7 日は推定。}
  - {id: b-buy2, phase: prep, kind: work, days: 1, after: [b-site], side: true, name: 煙突、鋼板、防水材などを買う, parts: [chimney, door, hood], reqs: [], src: [],
     desc: 煙突、H 笠、支持金具、鋼板、ケイカル板、取っ手、灰入れ、防水材、シート、ガルバの平板、金網を店で買う（調達モード）。日数は推定。}
  - {id: b-mail, phase: prep, kind: wait, days: 7, after: [b-site], name: 通販で取り寄せる（コーナン）, parts: [vent], reqs: [], src: [M88],
     desc: 放射温度計と頂部のベントをコーナンの通販で頼む。出荷の予定は品ごとに表示があり、出荷から北海道へ 3 日以上かかる（M88）。7 日は推定。}

  # 据え台と鉄のテーブル
  - {id: b-dig, phase: base, kind: work, days: 1, after: [b-buy1], name: 据え台の穴を掘り、砕石を締める, parts: [foundation], reqs: [R-08, R-14], src: [P98],
     desc: 足の 4 か所に 50 cm 角、深さ 30 cm の穴を掘り、底に外への勾配を付ける。砕石を 2 層に分けて 20 cm 入れ、タンパーで締める。土が粘土質なら 80 cm 角、深さ 51 cm にし、砕石を 35 cm にする（構造設計 3.5）。日数は推定。}
  - {id: b-pad, phase: base, kind: work, days: 1, after: [b-dig], name: 据え台を据え、穴をあける, parts: [foundation], reqs: [R-08, R-14], src: [],
     desc: ピンコロ 4 個を砕石の上に据え（粘土質なら 40 cm 角の平板の上に据え）、水糸と水平器で上面を地面から 50 mm に、4 個の差を 5 mm 以内にそろえる。中心に径 22 mm、深さ 75 mm の穴をあけ、まわりを砕石で埋め戻す。固めずに置くので手で撤去できる。日数は推定。}
  - {id: b-steelcut, phase: base, kind: work, days: 3, after: [b-order, b-mail2, b-buy1], name: 角パイプと板と全ねじを切り、穴をあける, parts: [stand, slab], reqs: [R-07], src: [],
     desc: 切り出しの一覧のとおり角パイプ、平鋼、鋼板、鋼管、全ねじを切り、交点、天板、ピン、方杖、水抜きの穴、約 250 個をあける。敷き板に切り欠きを入れる。切り口のばりを取る。日数は推定。}
  - {id: b-weld, phase: base, kind: work, days: 2, after: [b-steelcut], name: 溶接する, parts: [stand], reqs: [R-07], src: [],
     desc: 施主が自分で 22 か所を溶接する。先に作業台で底板にさや管を、方杖の上の端に板を付け、次に前の門形、天秤の組、後ろの横梁の当て板と吊り板、止めを付ける。めっきの品は溶接しない。日数は推定。}
  - {id: b-prime, phase: base, kind: work, days: 1, after: [b-weld], temp: 5, name: さび止めを塗る, parts: [stand, slab], reqs: [R-08], src: [P100, M103],
     desc: 溶接の跡、切り口、穴の縁と、黒皮の板（天板の下面と縁、底板、吊り板、当て板、止め、方杖の上の板、敷き板）を地金まで磨き、ローバルを 2 回塗る。乾燥は 23℃ で 30 分（P100）。気温 5℃ 以上、湿度 85% 以下で塗る（M103、抜粋）。日数は推定。}
  - {id: w-prime, phase: base, kind: wait, days: 1, after: [b-prime], name: さび止めの乾燥, parts: [stand, slab], reqs: [], src: [P100],
     desc: ローバルの乾燥は 23℃ で 30 分（P100）。上塗りまでに置く日数は未確認で、1 日は推定。}
  - {id: b-top1, phase: base, kind: work, days: 1, after: [w-prime], temp: 5, name: 上塗りの 1 回目, parts: [stand], reqs: [R-08], src: [M104],
     desc: 塗装品の角パイプの工場のさび止めを紙やすりで足付けし、油性の鉄部用塗料を塗る。塗る気温の下限は缶の注意で確かめる（未確認。5℃ は推定）。日数は推定。}
  - {id: w-top1, phase: base, kind: wait, days: 1, after: [b-top1], name: 塗り重ねの待ち, parts: [stand], reqs: [], src: [M109],
     desc: 同じ系統の油性塗料で、塗り重ねは夏 1 日後、冬 2 日後の例がある（M109）。使う塗料の値は未確認。}
  - {id: b-top2, phase: base, kind: work, days: 1, after: [w-top1], temp: 5, name: 上塗りの 2 回目, parts: [stand], reqs: [R-08], src: [M104],
     desc: 2 回目を塗る。日数は推定。}
  - {id: w-top2, phase: base, kind: wait, days: 2, after: [b-top2], name: 上塗りの乾燥, parts: [stand], reqs: [], src: [M109],
     desc: 部材を重ねる前に乾かす。乾燥は夏 4〜6 時間、冬 6〜15 時間の例がある（M109）。2 日は推定。}
  - {id: b-frame, phase: base, kind: work, days: 1, after: [w-top2, b-pad], name: 枠を据えて高さをそろえる, parts: [stand, foundation], reqs: [R-07, R-08, R-14], src: [],
     desc: 据え台に敷き板と全ねじを立て、前の門形と天秤の組を載せ、後ろの横梁をピンで吊る。側梁と根太を重ね、交点を全ねじで留め、方杖を前の脚と側梁に留める。ナットで高さを直し、天板の面を水平器で 2 mm 以内にそろえ、止めのすきまを左右とも 6 mm にする。角パイプの端にキャップをはめる。ボルトで組むので手で撤去できる。日数は推定。}
  - {id: b-deck, phase: base, kind: work, days: 1, after: [b-frame], name: 天板を留め、不織布を敷く, parts: [slab], reqs: [R-08, R-14], src: [F50],
     desc: 縞鋼板 6 枚を根太に載せ、交点の全ねじと M8 のボルトで留める。天板の全面に水を通す不織布を敷き、板の継ぎ目の上で切る。日数は推定。}

  # 炉床の断熱と炉床
  - {id: b-hins, phase: slab, kind: work, days: 2, after: [b-deck], temp: 5, name: 炉床の断熱を区画に分けて打つ, parts: [hearthIns], reqs: [R-14], src: [P55, P91],
     desc: 不織布の上に合板の帯で外まわりの型枠と区画の仕切りを組み、天板 1 枚ごとの 6 区画にする。1 日目に互い違いの 3 区画、2 日目に残りの 3 区画を、セメントとパーライト 1:5 で 100 mm 打つ（P55）。継ぎ目には薄いシートを挟む。型枠は固まってから外す（P91）。日数は推定。}
  - {id: w-hins, phase: slab, kind: wait, days: 7, after: [b-hins], name: 炉床の断熱の乾燥, parts: [hearthIns], reqs: [], src: [F57],
     desc: 数値の基準は無い。経験則は「少し乾いてから」から「数週間」まで（F57）。7 日は経験則の短い側。}
  - {id: b-hearth, phase: slab, kind: work, days: 1, after: [w-hins, b-order], name: 炉床のレンガを縦に並べる, parts: [hearth], reqs: [R-04], src: [],
     desc: 耐火レンガを縦に立てて並べ、水平をそろえる。日数は推定。}

  # ドームと前室
  - {id: b-cut, phase: dome, kind: work, days: 1, after: [b-order], side: true, name: レンガを切り、ドームの定規を作る, parts: [chamber], reqs: [], src: [],
     desc: 半割りのレンガを切り、中心で回す定規を作る。日数は推定。}
  - {id: b-dome, phase: dome, kind: work, days: 6, after: [b-hearth, b-cut], temp: 10, name: ドームのレンガを積む, parts: [chamber], reqs: [], src: [F58, P94],
     desc: 耐火モルタルでドームを積む。1 日数時間の作業で 10 日から 6 週かかった例がある（F58）。丸 1 日の作業で 6 日は推定。}
  - {id: b-land, phase: dome, kind: work, days: 2, after: [b-dome], temp: 10, name: 前室と焚き口を積む, parts: [landing], reqs: [], src: [P94],
     desc: 前室と焚き口のアーチを積み、煙突の台を作る。日数は推定。}
  - {id: w-dome, phase: dome, kind: wait, days: 2, after: [b-land], name: 目地の養生, parts: [chamber, landing], reqs: [], src: [P94],
     desc: 耐火モルタルは 24 時間以上養生し、急な乾燥と凍結を避ける（P94）。2 日は推定。}
  - {id: b-chim, phase: dome, kind: work, days: 1, after: [w-dome, b-buy2], name: 煙突を立てる, parts: [chimney], reqs: [R-11], src: [P92],
     desc: 煙突を前室の上に立て、支持金具で留め、H 笠を付ける。断熱の前に付ける（P92）。日数は推定。}
  - {id: b-door, phase: dome, kind: work, days: 2, after: [b-buy2], side: true, name: 扉とダンパーを作る, parts: [door, chimney], reqs: [], src: [],
     desc: 縞鋼板とケイカル板で扉を作り、鋼板でダンパーを作る。日数は推定。}

  # 断熱と外殻
  - {id: b-ins, phase: skin, kind: work, days: 1, after: [b-chim], temp: 5, name: ドームの断熱を盛る, parts: [insulation], reqs: [], src: [P55, P92],
     desc: セメントとパーライトを体積で 1:5 に練り、100 mm 盛る（P55）。}
  - {id: w-ins, phase: skin, kind: wait, days: 7, after: [b-ins], name: ドームの断熱の乾燥, parts: [insulation], reqs: [], src: [P77, F57],
     desc: 断熱が乾いてから金網と左官に進む（P77、日数は書かれていない）。雨の日は覆う。7 日は推定。}
  - {id: b-lath, phase: skin, kind: work, days: 1, after: [w-ins, b-mail], name: 金網を張り、ベントとひさしを付ける, parts: [shell, vent, hood], reqs: [R-08], src: [P77],
     desc: 断熱の上に金網を張る。頂部にベントを付け、焚き口の上にひさしを付ける。日数は推定。}
  - {id: b-render1, phase: skin, kind: work, days: 1, after: [b-lath], temp: 5, name: 左官の 1 層目, parts: [shell], reqs: [R-08], src: [P77, P86],
     desc: 金網の上に下塗りをする。乾かないよう水で湿らせ、シートを掛ける（P86 の 15.1.4）。}
  - {id: w-render1, phase: skin, kind: wait, days: 14, after: [b-render1], name: 下塗りのひび割れを出し切る, parts: [shell], reqs: [], src: [P86],
     desc: ラスの上の下塗りは 14 日以上置き、ひび割れを出し切ってから次を塗る。接着が確保できれば短くできる（P86 の 15.3.5）。}
  - {id: b-render2, phase: skin, kind: work, days: 1, after: [w-render1], temp: 5, name: 左官の 2 層目, parts: [shell], reqs: [R-08], src: [P77, P86],
     desc: 仕上げを塗り、水で湿らせて養生する。}
  - {id: w-render2, phase: skin, kind: wait, days: 7, after: [b-render2], name: 養生焚きまで 1 週間置く, parts: [shell], reqs: [], src: [P89, F61],
     desc: 窯ができてから 1 週間置いて養生焚きを始める（P89）。左官は 1 週間湿らせて強くするという経験則もある（F61）。}

  # 養生焚きと仕上げ
  - {id: b-cure, phase: fire, kind: work, days: 5, cont: true, after: [w-render2, b-door], name: 養生焚き, parts: [chamber, hearth, insulation, shell], reqs: [R-08], src: [P78, P89, F60],
     desc: 1 日目は 300°F（約 150℃）、以後 1 日 50°F ずつ上げ、5 日目に 500°F（約 260℃）。長いほうがよい（P89）。7 日で 7 回焚くのが普通という経験則もある（F60）。}
  - {id: m-firstbake, phase: fire, kind: mile, after: [b-cure], name: 初めて焼ける, parts: [], reqs: [], src: [],
     desc: 養生焚きが終われば焼ける。防水材を塗るまでは、冷めたら覆いを掛ける。}
  - {id: w-age, phase: fire, kind: wait, days: 21, after: [b-render2], name: 左官が 3 週間たつのを待つ, parts: [shell], reqs: [], src: [P82, F60],
     desc: 新しいモルタルは 3 週間以上たってから防水材を塗る（P82）。乾くまで塗らない。シートを掛けて内側が結露すれば乾いていない（F60）。}
  - {id: b-seal, phase: fire, kind: work, days: 2, after: [w-age, b-cure], name: 防水材を 2 回塗る, parts: [shell], reqs: [R-08], src: [P82],
     desc: 乾き切ってから浸透性の防水材を 2 回塗る（P82）。2 回目までの間隔は未確認で、2 日は推定。}
  - {id: m-done, phase: fire, kind: mile, after: [b-seal], name: できあがり, parts: [], reqs: [], src: [],
     desc: 覆いと薪置きを整えて、できあがり。}
