tools:
  - {id: t-grinder, group: build, name: ディスクグラインダーとダイヤモンドカッター, purpose: 前室の口のレンガを 3 つに切る、前室の天井の薄いレンガを切る、鋼材を切る, use: [b-hcut, b-steelcut, b-land]}
  - {id: t-trowel, group: build, name: 左官ごてと仕上げごて, purpose: 断熱の板をならす、キャスタブルを押し付ける、継ぎ目を薄く塗る, use: [b-hins]}
  - {id: t-level, group: build, name: 水平器, purpose: 埋める平板の傾き、据え台、天板、炉床の水平を見る, use: [b-dig, b-pad]}
  - {id: t-tape, group: build, name: メジャー, purpose: 寸法を測る。冬の靴で立った肘の高さを測る, use: [b-site]}
  - {id: t-line, group: build, name: 水糸, purpose: 据え台の位置と高さをそろえる, use: [b-dig]}
  - {id: t-bucket, group: build, name: バケツと練り舟, purpose: 断熱とキャスタブルを練る, use: [b-hins]}
  - {id: t-mixer, group: build, name: かくはん機（電動ドリルとかくはんの羽根）, purpose: キャスタブルを 30 分以内に練り上げる, use: [b-cast1]}
  - {id: t-scale, group: build, name: はかり（25 kg まで）, purpose: キャスタブルと水の量を量る。初めの組み直しで、ドームの 1 個ずつの重さを量る, use: [b-cast1, b-cast2, b-assy]}
  - {id: t-skewer, group: build, name: 竹串（約 300 本）と油性ペン, purpose: キャスタブルの厚さの目印。頭を 42 mm に出し、50 mm ごとに刺す（輪と蓋で約 270 本、付録 B.10）, use: [b-form]}
  - {id: t-shovel, group: build, name: スコップ, purpose: 砂、砕石、セメントを混ぜる、運ぶ, use: [b-dig]}
  - {id: t-mallet, group: build, name: ゴムハンマー, purpose: 炉床のレンガを据える, use: [b-hearth]}
  - {id: t-tamper, group: build, name: タンパー, purpose: 砕石を締める, use: [b-dig]}
  - {id: t-mask, group: build, name: 防じんマスク（DS2）, purpose: 切る、磨く、練る、毛布を扱うときの粉じんを避ける, use: [b-steelcut]}
  - {id: t-goggles, group: build, name: 保護めがね, purpose: 切る、磨く、練るときの破片としぶきを避ける, use: [b-dig, b-steelcut]}
  - {id: t-ear, group: build, name: 耳栓, purpose: グラインダーの音を避ける, use: [b-steelcut]}
  - {id: t-gloves, group: build, name: 作業手袋, purpose: 手を守る, use: [b-dig]}
  - {id: t-rgloves, group: build, name: ゴム手袋, purpose: キャスタブルとセメントのアルカリから手を守る, use: [b-hins]}
  - {id: t-drill, group: build, name: 振動ドリル, purpose: 鋼材と据え台の穴、殻の下穴、前室の受け金を留める天板の穴をあける, use: [b-dig, b-pad, b-land]}
  - {id: t-saw, group: build, name: のこぎりか丸のこ, purpose: 型枠と型板の合板を切る, use: [b-hins]}
  - {id: t-snips, group: build, name: 金切りばさみ, purpose: 殻の板、波板、網、天板の不織布、前室の脇の水切り板（ステンレス 0.5 mm）を切る, use: [b-deck, b-land]}
  - {id: t-knife, group: build, name: カッターと長い定規, purpose: 毛布と継ぎ目の紙を切る, use: [b-door]}
  - {id: t-spray, group: build, name: 霧吹き, purpose: 砂の山とキャスタブルを湿らせる, use: [b-form]}
  - {id: t-airthermo, group: build, name: 気温を測る温度計, purpose: 気温 5℃ 以上を確かめてから流し、塗る, use: [b-hins]}
  - {id: t-gauge, group: build, name: 隙間ゲージ, purpose: 継ぎ目とひびの幅を測って記録する, use: [b-assy]}
  - {id: t-brush, group: build, name: 刷毛, purpose: さび止め、上塗りを塗る, use: [b-prime]}
  - {id: t-ladder, group: build, name: 脚立, purpose: 煙突の頂部の作業, use: [b-chim]}
  - {id: t-welder, group: build, name: 溶接機 100 V のノンガス半自動（インバーター、80〜140 A 級、ワイヤ 0.8〜0.9 mm）, purpose: "100 V では 80 A 級で使う（M127）。前の T、後ろの門形、脚の耳、管の端の板、帯、前室、殻の枠、前掛けを溶接する。亜鉛めっきの品は溶接しない。入力は 24〜29 A で、家の 15 A のコンセントでは足りないことがある（20 A のコンセントと延長コードの行）", use: [b-weld], have: 買う}
  - {id: t-wmask, group: build, name: 自動で暗くなる溶接面, purpose: 溶接の光から目と顔を守る, use: [b-weld], have: 買う}
  - {id: t-wire, group: build, name: フラックス入りワイヤ 0.8〜0.9 mm（溶接機に合うもの）, purpose: ガスを使わずに、2.3 mm の管と、管に付ける 3〜6 mm の板をすみ肉で溶接する。板は適用板厚 4.0 mm（バディ 80、M127）を超えるが、すみ肉の脚長は薄い管に合わせて約 3 mm で足りる見込み（推定）。6 mm の板どうしの突き合わせはしない, use: [b-weld], have: 買う}
  - {id: t-wgloves, group: build, name: 溶接用の革手袋と革のエプロン, purpose: 火花とやけどを避ける, use: [b-weld], have: 買う}
  - {id: t-cord, group: build, name: 20 A のコンセントと太く短い延長コード（2.0 mm² 以上）, purpose: 溶接機の入力 24〜29 A に合わせる（M127）。15 A のコンセントにしかつなげないときは電流を下げ、ブレーカーが落ちないかを見る, use: [b-weld]}
  - {id: t-chip, group: build, name: スラグを落とすハンマー（チッピングハンマー）, purpose: 溶接のあとの溶剤のかす（スラグ）を落とす, use: [b-weld], have: 買う}
  - {id: t-magnet, group: build, name: 溶接用のマグネット, purpose: 部材を直角と 45°に保って溶接する, use: [b-weld], have: 買う}
  - {id: t-fire, group: build, name: 消火器と水を張ったバケツ, purpose: 溶接と切断の火花に備える。溶接する所のまわりから燃える物をどける, use: [b-steelcut, b-weld]}
  - {id: t-cutdisc, group: build, name: 鉄用の切断砥石と研磨ディスク, purpose: 角パイプ、山形鋼、平鋼、全ねじを切り、ばりと塗膜を落とす, use: [b-steelcut]}
  - {id: t-wbrush, group: build, name: ワイヤブラシと紙やすり, purpose: 溶接のあとのスラグ、黒皮、さびを落とす, use: [b-weld, b-prime], have: 買う}
