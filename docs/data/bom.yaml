  - {id: t-meter, group: bake, name: 薪の水分計, purpose: 含水率 20% 以下を確かめる（P64）, use: [b-dry]}
  - {id: t-bag, group: bake, name: 保温バッグ, purpose: 冬に生地を運ぶ, use: []}
  - {id: t-snow, group: bake, name: 雪かきのスコップ, purpose: 台と殻のまわりの雪を、台の梁の下に届く前に下ろす（付録 A.7）, use: []}
  - {id: t-sbrush, group: bake, name: 柄の長い雪払いのほうき, purpose: 殻の屋根と前室の天板と天板の前の出の雪を払う（付録 A.7）, use: []}
  - {id: t-timer, group: bake, name: タイマー, purpose: 30 分ごとに内面を測る、窯入れの時刻を守る, use: [b-dry]}
