# 部品リストと道具の一覧の正。調達モード（docs/navigator/proc.js）と、部品リスト（docs/05-parts-list.md の 5.2 と 5.3 の表）がここから作られる。
# 05 の表は python tools/gen_bom.py で書き直す。手で直すと gen_nav の点検（E16）で落ちる。
# items（10 万円に含める品）
#   cat: 費用の分け方（categories の id）
#   shop、how: 買う所と買い方（店頭、取り寄せ、通販）
#   batch: 届く工程（build.yaml の準備と調達の工程か、後で足す段階 later の買う工程）。use の工程より前に終わること（E15）
#          届く工程が後で足す段階（phase: later）の品は、05 の表で「後で足す分」に数え、合計から引いた額を「いまの出費」にする（gen_bom.py）
#   use: 使う工程（build.yaml の id）、parts: 使う部品（model.yaml の id）
#   tentative: 値段が仮の値のとき true
#   status: 未手配、注文済み、入手済み（書かなければ未手配）。paid: 払った額（円）
# tools（10 万円の外。値段は書かない）
#   group: build（組むとき）か bake（焼くとき）、use: 最初に使う工程、have: 持っている、借りる、買う、未確認（書かなければ未確認）
meta:
  budget: 100000
  date: "2026-10-21"
  note: 分割のキャスタブルのドーム（内径 0.6 m、4 個）、炉床はレンガ 65 mm を切らずに四角に並べる、毛布 75 mm、45°の切妻の塗った鋼板の殻、後ろの脚を ±0.90 m に開いたボルト組みの 3 本脚、各脚から外へ 60°で張る埋めた平板の風の留めの案である。初めのうちは煙突と垂れ壁を付けずに焚き、煙突の直筒、H 笠、支持金具は後で足す（施主の決定 2026-10-21）ので、届く工程を後で足す段階の b-buy4 にした。合計は 10 万円を超え、超える分の扱いは施主が決める。北海道で受け取れる見込みの品で数えた。確かめていない品は注記に書いた。

categories:
  - {id: brick, name: キャスタブルとレンガ}
  - {id: ins, name: 断熱と毛布}
  - {id: base, name: 台と天板と据え台}
  - {id: chim, name: 煙突}
  - {id: door, name: 前室、扉、温度計、灰入れ、前掛け}
  - {id: weather, name: 殻と屋外の備え}
  - {id: ship, name: 送料}

