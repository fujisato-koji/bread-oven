  - {id: t-mop, group: bake, name: 炉床を拭く布, purpose: 炉床の灰を取る（冷ますために拭かない）, use: [m-firstbake]}
  - {id: t-hgloves, group: bake, name: 耐熱手袋, purpose: 熱い物を扱う, use: [b-dry]}
