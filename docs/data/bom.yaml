  - {id: t-line, group: build, name: 水糸, purpose: 据え台の位置と高さ、段の通りをそろえる, use: [b-dig]}
  - {id: t-bucket, group: build, name: バケツと練り舟, purpose: 断熱とモルタルを練る, use: [b-hins]}
  - {id: t-shovel, group: build, name: スコップ, purpose: 砂、砕石、セメントを混ぜる、運ぶ, use: [b-dig]}
  - {id: t-mallet, group: build, name: ゴムハンマー, purpose: レンガを据える, use: [b-hearth]}
  - {id: t-tamper, group: build, name: タンパー, purpose: 砕石を締める, use: [b-dig]}
  - {id: t-mask, group: build, name: 防じんマスク（DS2）, purpose: 切る、磨く、混ぜるときの粉じんを避ける, use: [b-steelcut]}
