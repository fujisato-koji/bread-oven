  - {id: t-concbit, group: build, name: コンクリート用のドリルの刃 26 mm, purpose: 据え台に M24 の全ねじの先を受ける穴（深さ 100 mm）をあける, use: [b-pad]}
  - {id: t-clamp, group: build, name: クランプ, purpose: 切る、穴をあける、溶接するときに材を留める, use: [b-steelcut, b-weld], have: 買う}
  - {id: t-square, group: build, name: スコヤと差し金, purpose: 脚と梁の直角と当て板の位置を見る, use: [b-steelcut]}
  - {id: t-punch, group: build, name: センターポンチ, purpose: 穴の位置を打つ, use: [b-steelcut]}
  - {id: t-spanner, group: build, name: スパナとめがねレンチ（13、17、24、36 mm）とソケットレンチ, purpose: ナットを締める、頭を押さえる（前室の引きボルトと受け金の M8 は 13 mm）, use: [b-dig, b-frame, b-land]}
  - {id: t-jack, group: build, name: 油圧ジャッキ 2 t と敷き板, purpose: 足の荷を抜いて高さを直す（年 1 回も使う）, use: [b-frame]}
  - {id: t-vise, group: build, name: バイスプライヤー, purpose: 全ねじを押さえる, use: [b-frame]}
  - {id: t-bvise, group: build, name: 万力（作業台に留める）, purpose: 前室の耳と受け金を挟んで切り、穴をあける。脇の水切り板を木の当て木と挟んで折る, use: [b-steelcut, b-land]}
