  - {id: t-gloves, group: build, name: 作業手袋, purpose: 手を守る, use: [b-dig]}
  - {id: t-drill, group: build, name: 振動ドリル, purpose: 鋼材と据え台の穴、ひさしとベントの下穴をあける, use: [b-pad]}
  - {id: t-saw, group: build, name: のこぎりか丸のこ, purpose: 型枠の合板を帯に割く, use: [b-hins]}
  - {id: t-snips, group: build, name: 金切りばさみ, purpose: ひさしのガルバ、外殻の金網、天板の不織布を切る, use: [b-deck]}
