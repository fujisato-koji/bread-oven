  - {id: t-ladder, group: build, name: 脚立, purpose: 煙突の頂部の作業, use: [b-chim]}
  - {id: t-peel, group: bake, name: ピール（木と金属）, purpose: 生地を入れる、パンを出す, use: [m-firstbake]}
  - {id: t-rake, group: bake, name: 熾火の掻き出し棒, purpose: 熾火を掻き出す, use: [m-firstbake]}
  - {id: t-hbrush, group: bake, name: 炉床のブラシ, purpose: 炉床の灰を払う, use: [m-firstbake]}
  - {id: t-mop, group: bake, name: 炉床を拭くモップ, purpose: 炉床を拭く, use: [m-firstbake]}
  - {id: t-hgloves, group: bake, name: 耐熱手袋, purpose: 熱い物を扱う, use: [b-cure]}
  - {id: t-meter, group: bake, name: 薪の水分計, purpose: 含水率 20% 以下を確かめる（P64）, use: [b-cure]}
