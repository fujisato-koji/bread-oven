site_name: パン窯の設計検討
site_url: https://fujisato-koji.github.io/bread-oven/
site_description: 自宅の庭に据えるパン窯を自分で組むための設計検討
repo_url: https://github.com/fujisato-koji/bread-oven
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 暗い表示にする
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 明るい表示にする

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - はじめに: index.md
  - 1. 要求: 01-requirements.md
  - 2. 構造様式: 02-configuration.md
  - 3. 構造設計: 03-structural-design.md
  - 4. 部材の入手性: 04-procurement.md
  - 5. 部品リストと費用: 05-parts-list.md
  - 3D の全体像: model.md
  - 出典: sources.md
